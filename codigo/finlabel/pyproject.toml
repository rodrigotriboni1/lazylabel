[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finlabel-local"
version = "0.1.0"
description = "Local-first tools for assisted labeling of financial data."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FinLabel contributors" }]
dependencies = []

[project.scripts]
finlabel = "finlabel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
